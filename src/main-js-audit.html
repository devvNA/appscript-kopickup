<script>
      //          COMPLIANCE & AUDIT VIEWER
      // ==========================================

      function loadAuditPage() {

        google.script.run
          .withSuccessHandler((res) => {
            if (res.success) {
              STATE.auditLogs = res.logs;
              drawAuditLogsList();
            }
          })
          .rpcGetAuditLogs(STATE.currentUser);
      }

      function drawAuditLogsList(filteredLogs = null) {
        const tbody = document.getElementById("audit-table-body");
        tbody.innerHTML = "";

        const logs = filteredLogs || STATE.auditLogs;

        if (logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-coffeeBean/50">Tidak ada log audit ditemukan.</td></tr>`;
          return;
        }

        logs.forEach((log) => {
          const row = document.createElement("tr");
          row.className =
            "border-b border-coffeeBean/10 hover:bg-coffeeBean/5 font-medium";

          // Parse before/after data for display
          let details = "-";
          try {
            if (log.action === "UPDATE_PRODUCT") {
              const before =
                typeof log.beforeData === "string"
                  ? JSON.parse(log.beforeData)
                  : log.beforeData;
              const after =
                typeof log.afterData === "string"
                  ? JSON.parse(log.afterData)
                  : log.afterData;

              // Collect updated keys
              const changes = [];
              for (let key in after) {
                if (
                  before &&
                  before[key] !== after[key] &&
                  key !== "created_at"
                ) {
                  changes.push(`${key}: ${before[key]} ➔ ${after[key]}`);
                }
              }
              details = changes.join(", ");
            } else if (log.action === "CREATE_PRODUCT") {
              const after =
                typeof log.afterData === "string"
                  ? JSON.parse(log.afterData)
                  : log.afterData;
              details = `Nama: ${after.name}, Harga: Rp ${after.price.toLocaleString("id-ID")}, Kategori: ${after.category}`;
            } else if (log.action === "STOCK_ADJUSTMENT") {
              const before =
                typeof log.beforeData === "string"
                  ? JSON.parse(log.beforeData)
                  : log.beforeData;
              const after =
                typeof log.afterData === "string"
                  ? JSON.parse(log.afterData)
                  : log.afterData;
              details = `Stok Terkoreksi: ${before.stock} ➔ ${after.stock}. Alasan: ${after.reason || "-"}`;
            } else if (log.action === "OPEN_SHIFT") {
              const after =
                typeof log.afterData === "string"
                  ? JSON.parse(log.afterData)
                  : log.afterData;
              details = `Kas Awal Modal: Rp ${Number(after.open_cash).toLocaleString("id-ID")}`;
            } else if (log.action === "CLOSE_SHIFT") {
              const after =
                typeof log.afterData === "string"
                  ? JSON.parse(log.afterData)
                  : log.afterData;
              details = `Tutup Drawer. Total Sales: Rp ${after.totalSales.toLocaleString("id-ID")}, Mismatch: Rp ${after.mismatchVariance.toLocaleString("id-ID")}`;
            } else if (log.action === "CHECKOUT_ORDER") {
              const after =
                typeof log.afterData === "string"
                  ? JSON.parse(log.afterData)
                  : log.afterData;
              details = `Belanja Order: ${after.transaction_no}, Total: Rp ${after.total.toLocaleString("id-ID")}`;
            } else if (log.action.includes("TRANSACTION")) {
              const after =
                typeof log.afterData === "string"
                  ? JSON.parse(log.afterData)
                  : log.afterData;
              details = `Batal Status. Alasan: ${after.void_reason || "-"}`;
            }
          } catch (e) {
            details = "Resolving details...";
          }

          row.innerHTML = `
          <td class="py-3 px-2 text-coffeeBean/60">${new Date(log.createdAt).toLocaleString("id-ID")}</td>
          <td class="py-3 px-2 font-bold">${log.userName}</td>
          <td class="py-3 px-2 font-mono font-bold text-coffeeBean">${log.action}</td>
          <td class="py-3 px-2 uppercase text-[10px] font-bold text-coffeeBean/60">${log.entityType}</td>
          <td class="py-3 px-2 italic text-espressoBlack/80 font-medium max-w-xs truncate" title="${details}">${details}</td>
        `;
          tbody.appendChild(row);
        });
      }

      function filterAuditLogs() {
        const q = document
          .getElementById("audit-search-input")
          .value.toLowerCase()
          .trim();
        if (!q) {
          drawAuditLogsList();
          return;
        }

        const filtered = STATE.auditLogs.filter((log) => {
          return (
            log.userName.toLowerCase().includes(q) ||
            log.action.toLowerCase().includes(q) ||
            log.entityType.toLowerCase().includes(q)
          );
        });
        drawAuditLogsList(filtered);
      }



      // ==========================================
</script>
