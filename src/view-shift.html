                      class="text-[10px] font-bold text-coffeeBean uppercase tracking-wider"

                    <p

                      class="text-xl font-bold text-espressoBlack mt-1"
                    >

                  </div>
                  <div class="bg-coffeeBean/5 p-4 rounded-xl">
                    <span
                      class="text-[10px] font-bold text-coffeeBean uppercase tracking-wider"

                    <p
                      id="shift-stat-noncash"
                      class="text-xl font-bold text-espressoBlack mt-1"

                  </div>
                  <div

                    <span class="text-coffeeBean/60">Shift Dibuka Pada:</span>

                  <div class="flex justify-between">
                    <span class="text-coffeeBean/60">Jumlah Transaksi:</span>
                    <span id="shift-info-orders" class="font-bold"

                    <div class="relative">
                      <span
                        class="absolute inset-y-0 left-0 pl-3 flex items-center text-coffeeBean/50 text-xs font-bold"
                        >Rp</span
                      >
                      <input
                        type="text"
                        id="close-cash-input"
                        inputmode="numeric"
                        placeholder="0"
                        oninput="formatCloseCashInput(this)"

                      />
                    </div>
                  </div>
                  <button
                    onclick="handleCloseShift()"
                    class="w-full py-3 bg-coffeeBean hover:bg-espressoBlack text-creamLatte font-bold rounded-button text-xs uppercase tracking-wider shadow transition"

              <div

                        <th class="py-3 px-1 text-right">Selisih</th>
                      </tr>
                    </thead>
                    <tbody id="shift-history-table">

                    </tbody>
                  </table>
                </div>
              </div>
            </div>
