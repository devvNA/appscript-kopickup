    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f2e8d8;
        color: #231815;
        -webkit-text-size-adjust: 100%;
      }

      /* When platform is active, lock body to viewport height so inner flex scroll works */
      body.platform-active {
        height: 100vh;
        height: 100dvh;
        min-height: 0; /* override Tailwind min-h-screen */
        overflow: hidden;
      }

      .cormorant-brand {
        font-family: "Cormorant Garamond", serif;
      }

      /* Checkerboard border matching menu.jpeg */
      .checkerboard-border {
        background-image:
          linear-gradient(45deg, #b66a3c 25%, transparent 25%),
          linear-gradient(-45deg, #b66a3c 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #b66a3c 75%),
          linear-gradient(-45deg, transparent 75%, #b66a3c 75%);
        background-size: 20px 20px;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0px;
        background-color: #f2e8d8;
        height: 12px;
      }

      /* Smooth Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(75, 46, 36, 0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(75, 46, 36, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(75, 46, 36, 0.5);
      }

      /* ===== MOBILE SIDEBAR ===== */
      #sidebar-overlay {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #sidebar-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }
      @media (max-width: 767px) {
        #app-sidebar {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          width: 280px;
          max-width: 85vw;
          z-index: 40;
          transform: translateX(-100%);
          transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #app-sidebar.open {
          transform: translateX(0);
        }
      }

      /* ===== MOBILE TABLE CARDS ===== */
      @media (max-width: 639px) {
        .responsive-table thead {
          display: none;
        }
        .responsive-table tbody tr {
          display: block;
          border: 1px solid rgba(75, 46, 36, 0.1);
          border-radius: 12px;
          padding: 12px;
          margin-bottom: 8px;
          background: #f2e8d8;
        }
        .responsive-table tbody td {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 4px 0 !important;
          border: none !important;
          font-size: 11px;
        }
        .responsive-table tbody td::before {
          content: attr(data-label);
          font-weight: 700;
          text-transform: uppercase;
          font-size: 9px;
          letter-spacing: 0.05em;
          color: rgba(75, 46, 36, 0.5);
          flex-shrink: 0;
          margin-right: 8px;
        }
      }

      /* Safe area for iOS notch — only when body scrolls (login view) */
      @supports (padding: env(safe-area-inset-bottom)) {
        body:not(.platform-active) {
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      /* Hide footer on mobile when platform is active to maximize content space */
      @media (max-width: 767px) {
        body.platform-active #app-footer {
          display: none;
        }
      }
    </style>
